        /* Integrated header design */
        .section-header {
            text-align: center;

        /* Subtle glitch effect for Creative Process title */
        .glitch-title {
            position: relative;
            animation: glitchText 3s infinite;
            margin-bottom: 15px;
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }

        .glitch-title::before {
            left: 1px;
            text-shadow: -1px 0 rgba(255, 107, 53, 0.5);
            animation: glitchBefore 3s infinite linear alternate-reverse;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-title::after {
            left: -1px;
            text-shadow: 1px 0 rgba(0, 255, 136, 0.5);
            animation: glitchAfter 2.5s infinite linear alternate-reverse;
            clip: rect(0, 0, 0, 0);
        }

        @keyframes glitchText {
            0%, 90% {
                transform: translate(0);
            }
            91% {
                transform: translate(-1px, 1px);
            }
            93% {
                transform: translate(1px, -1px);
            }
            95% {
                transform: translate(-1px, -1px);
            }
            97% {
                transform: translate(1px, 1px);
            }
            100% {
                transform: translate(0);
            }
        }

        @keyframes glitchBefore {
            0%, 85% {
                clip: rect(0, 0, 0, 0);
            }
            86% {
                clip: rect(30px, 9999px, 50px, 0);
            }
            88% {
                clip: rect(80px, 9999px, 100px, 0);
            }
            90%, 100% {
                clip: rect(0, 0, 0, 0);
            }
        }

        @keyframes glitchAfter {
            0%, 87% {
                clip: rect(0, 0, 0, 0);
            }
            88% {
                clip: rect(60px, 9999px, 80px, 0);
            }
            90% {
                clip: rect(20px, 9999px, 40px, 0);
            }
            92%, 100% {
                clip: rect(0, 0, 0, 0);
            }
        }

        .gallery-image .static-image,
        .gallery-image .animated-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            pointer-events: none;
        }

        .gallery-image .static-image {
            opacity: 1;
            visibility: visible;
            z-index: 2;
            transition: opacity 0.3s ease, visibility 0s linear 0s;
        }

        .gallery-image .animated-image {
            opacity: 0;

            z-index: 1;

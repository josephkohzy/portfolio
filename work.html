        /* ==========================================
           ANIMATED BACKGROUND LAYERS
           ========================================== */
        
        body {
            background: #0a0a0a;
            position: relative;
            overflow-x: hidden;
        }

        /* BG-LAYER-1: Animated gradient orbs */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,107,53,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,255,136,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255,107,53,0.08) 0%, transparent 40%);
            animation: gradientPulse 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientPulse {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            33% {
                transform: translate(-10%, 10%) scale(1.1);
                opacity: 0.8;
            }
            66% {
                transform: translate(10%, -10%) scale(0.9);
                opacity: 1;
            }
        }

        /* BG-LAYER-2: Floating geometric shapes */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, transparent 48%, rgba(255,107,53,0.03) 49%, rgba(255,107,53,0.03) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(0,255,136,0.02) 49%, rgba(0,255,136,0.02) 51%, transparent 52%);
            background-size: 100px 100px, 100px 100px;
            background-position: 0 0, 50px 50px;
            animation: shapeMove 20s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
        }

        @keyframes shapeMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(50px, 50px) rotate(360deg);
            }
        }

        /* BG-LAYER-3: Animated scan lines */
        .scan-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 136, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(255, 107, 53, 0.02) 3px,
                transparent 4px
            );
            animation: scanlineMove 10s linear infinite;
        }

        @keyframes scanlineMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(20px);
            }
        }

        /* INTEGRATED PROJECT CARDS - GLASS MORPHISM */
        .project-card {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        /* Subtle glow effect on hover */
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 107, 53, 0.15) 0%,
                rgba(0, 255, 136, 0.1) 40%,
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .project-card:hover::before {
            opacity: 1;
        }

        /* Animated border gradient */
        .project-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 107, 53, 0.4),
                rgba(0, 255, 136, 0.4),
                transparent
            );
            background-size: 200% 200%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .project-card:hover::after {
            opacity: 1;
        }

        .project-card:hover {
            transform: translateY(-8px);
            background: rgba(30, 30, 30, 0.6);
            border-color: rgba(255, 107, 53, 0.4);
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 107, 53, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* INTEGRATED IMAGE WITH OVERLAY */
        .project-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        }

        .project-video-hover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        /* Soft texture overlay */
        .project-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 20px);
            mix-blend-mode: overlay;
        }

        /* Hover "VIEW" text with glow */
        .project-image::after {
            content: 'VIEW';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
            color: white;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 
                0 0 20px rgba(255, 107, 53, 0.8),
                0 0 40px rgba(0, 255, 136, 0.6),
                2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 8px;
        }

        .project-card:hover .project-image::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .project-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            background: rgba(255, 107, 53, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            font-weight: 700;

            letter-spacing: 1.5px;
            box-shadow:

                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: rotate(0deg);

            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

                0 6px 20px rgba(0, 255, 136, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);

            display: flex;
            flex-direction: column;
            position: relative;

            margin-bottom: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;

            gap: 5px;

            font-size: 0.6rem;

            line-height: 1.5;

            margin-bottom: 12px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

            display: flex;
            gap: 6px;
            flex-wrap: wrap;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: var(--rust);

            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 53, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .project-card:hover .tag {
            background: rgba(255, 107, 53, 0.2);
            border-color: rgba(255, 107, 53, 0.4);
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .projects-grid {

        @media (max-width: 600px) {
            .works-title {
                font-size: 2.5rem;

                grid-template-columns: 1fr;
                gap: 30px;

        /* ==========================================
           REVEAL ANIMATIONS
           ========================================== */
        
        /* Fade up animation */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Staggered animation for project cards */
        .project-card {
            opacity: 0;
            transform: translateY(60px) rotate(-2deg);
            transition: opacity 0.8s ease, transform 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .project-card.visible {
            opacity: 1;
            transform: translateY(0) rotate(0deg);
        }

        /* Add delay to each card */
        .project-card:nth-child(1) { transition-delay: 0.1s; }
        .project-card:nth-child(2) { transition-delay: 0.2s; }
        .project-card:nth-child(3) { transition-delay: 0.3s; }
        .project-card:nth-child(4) { transition-delay: 0.4s; }
        .project-card:nth-child(5) { transition-delay: 0.5s; }
        .project-card:nth-child(6) { transition-delay: 0.6s; }
        .project-card:nth-child(7) { transition-delay: 0.7s; }
        .project-card:nth-child(8) { transition-delay: 0.8s; }
        .project-card:nth-child(9) { transition-delay: 0.9s; }
        .project-card:nth-child(10) { transition-delay: 1.0s; }

        /* Scale in animation for title */
        .works-title {
            opacity: 0;
            transform: scale(0.8) translateY(-20px);
            animation: titleReveal 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            animation-delay: 0.2s;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>

                duration: '1 week',
                role: 'vfx, design & Supers',
                type: 'Client',
                description: 'A national health screening PSA by Singapore’s Health Promotion Board, aimed to raise awareness on the importance of regular health screening.',
                tags: ['PSA commercial', 'VFX', 'Design']
            }
        ];

        // Gradient colors for project images
        function getGradient(index) {
            const gradients = [
                '#667eea 0%, #764ba2 100%',
                '#f093fb 0%, #f5576c 100%',
                '#4facfe 0%, #00f2fe 100%',
                '#43e97b 0%, #38f9d7 100%',
                '#fa8bff 0%, #2bd2ff 100%',
                '#ffecd2 0%, #fcb69f 100%',
                '#30cfd0 0%, #330867 100%',
                '#ff9a56 0%, #ff6a88 100%',
                '#a8edea 0%, #fed6e3 100%',
                '#fbc2eb 0%, #a6c1ee 100%'
            ];
            return gradients[index % gradients.length];
        }

        // Load projects into grid
        function loadProjects() {
            const projectsGrid = document.getElementById('projects-grid');
            
            if (!projectsGrid) {
                console.error('projects-grid element not found!');
                return;
            }
            
            let html = '';
            projects.forEach((project, index) => {
                const badgeClass = project.type === 'personal' ? 'personal' : '';
                const badgeText  = project.type === 'personal' ? 'Personal' : 'Client';

                // Custom pages link to their own dedicated HTML file
                const href = project.isCustom
                    ? (project.customUrl || 'my10.html')
                    : `project.html?project=${project.id}`;

                // Determine card class
                let cardClass = '';
                if (project.id === 'my10')    cardClass = ' my10-card';
                if (project.id === 'unify')   cardClass = ' unify-card';

                // All cards use webm video overlay — plays by default, static shown on hover
                const webmUrl = project.gifUrl ? project.gifUrl.replace('.gif', '.webm') : '';
                let imageStyle;
                if (project.staticUrl) {
                    imageStyle = `background-image: url('${project.staticUrl}'); background-size: cover; background-position: center;`;
                } else {
                    imageStyle = `background: linear-gradient(135deg, ${getGradient(index)});`;
                }

                const videoHtml = webmUrl
                    ? `<video class="project-video-hover" muted loop playsinline preload="none"><source data-src="${webmUrl}" type="video/webm"></video>`
                    : '';

                html += `
                    <a href="${href}" class="project-card${cardClass}">
                        <div class="project-image"
                            data-webm="${webmUrl}"
                            data-static="${project.staticUrl || ''}"
                            style="${imageStyle}">
                            ${videoHtml}
                            <span class="project-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="project-content">
                            <div class="project-number">Project ${String(index + 1).padStart(2, '0')}</div>
                            <h3 class="project-title">${project.title}</h3>
                            <div class="project-meta">
                                <div class="project-meta-item">${project.client}</div>
                                <div class="project-meta-item">${project.duration}</div>
                            </div>
                            <p class="project-description">${project.description}</p>
                            <div class="project-tags">
                                ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </a>
                `;
            });
            
            projectsGrid.innerHTML = html;
            
            // Initialize scroll animations after projects are loaded
            initScrollAnimations();

            // ── Lazy-load GIFs + hover swap ────────────────────────────────────
            // ── Lazy-load WebM + play by default, static on hover ─────────────
            const videoObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const imgEl = entry.target;
                    const video = imgEl.querySelector('.project-video-hover');
                    if (!video) { obs.unobserve(imgEl); return; }
                    video.querySelectorAll('source[data-src]').forEach(s => { s.src = s.dataset.src; });
                    video.load();
                    video.play().catch(() => {});
                    obs.unobserve(imgEl);
                });
            }, { rootMargin: '200px 0px', threshold: 0 });

            document.querySelectorAll('.project-image[data-webm]').forEach(function(imgEl) {
                if (!imgEl.dataset.webm) return;
                videoObserver.observe(imgEl);
                const video = imgEl.querySelector('.project-video-hover');
                const staticUrl = imgEl.dataset.static;
                if (!video) return;
                imgEl.addEventListener('mouseenter', function() {
                    video.style.opacity = '0';
                    video.pause();
                    if (staticUrl) imgEl.style.backgroundImage = `url('${staticUrl}')`;
                });
                imgEl.addEventListener('mouseleave', function() {
                    video.style.opacity = '1';
                    video.play().catch(() => {});
                });
            });
        }

        // Initialize scroll-triggered animations
        function initScrollAnimations() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -100px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            // Observe all project cards
            document.querySelectorAll('.project-card').forEach(el => {
                observer.observe(el);
            });

            // Observe other fade-in elements
            document.querySelectorAll('.fade-up').forEach(el => {
                observer.observe(el);
            });
        }

        // Wait for DOM to be fully loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadProjects);
        } else {
            // DOM is already ready
            loadProjects();
        }

        // Mouse tracking for card glow effect
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.project-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
</body>
</html>
